<!DOCTYPE html>
<html>
    <head>
        <title>Command Executor</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>

        <h2>Run Command</h2>

        <form method="POST">
            <input type="text" name="cmd" placeholder="Enter command">
            <button type="submit">Execute</button>
        </form>

        {% if output %}
        <pre>{{ output }}</pre>
        {% endif %}

        <a href="/">Back</a>

    </body>
</html>
