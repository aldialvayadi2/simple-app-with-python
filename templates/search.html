<!DOCTYPE html>
<html>
    <head>
        <title>Search</title>
        <link rel="stylesheet" href="/static/style.css">
    </head>

    <body>
        <h2>Search</h2>
        <form method="POST">
            <input type="text" name="q" placeholder="Search something">
            <button type="submit">Search</button>
        </form>

        {% if result %}
        <p>{{ result }}</p>
        {% endif %}

        <a href="/">Back</a>
    </body>
</html>
