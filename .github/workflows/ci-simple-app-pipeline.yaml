name: Simple App Pipeline

on:
  push:
  pull_request:

jobs:

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Semgrep SAST
        uses: returntocorp/semgrep-action@v1
        with:
          config: auto

  dependency_scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH

  build_and_scan_container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t simple-app-python .

      - name: Scan container image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: simple-app-python
          severity: CRITICAL,HIGH

  dast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run app
        run: |
          docker build -t simple-app-python .
          docker run -d -p 8080:8080 simple-app-python
          
      - name: Test app
        run: |
          curl http://localhost:8080
          
